name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test --release

      - name: Rust clippy
        run: cargo clippy --release --all-targets --message-format=short

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dsh-flow/package-lock.json

      - name: Engine dependencies
        working-directory: dsh-flow
        run: npm ci --ignore-scripts

      - name: Engine type check
        working-directory: dsh-flow
        run: npm run check

      - name: Engine tests
        working-directory: dsh-flow
        run: npm test

      # The release script is what people actually install. A broken copy step — a
      # missing helper, a missing engine folder — would otherwise only be found by
      # whoever packaged next, so the workflow builds one package and checks what
      # must be inside it.
      - name: Release package
        shell: pwsh
        run: |
          ./scripts/release.ps1 -SkipTests
          $zip = Get-ChildItem dist/PAgent-*-*.zip | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $zip) { throw 'the release script produced no package' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            foreach ($required in @('dsh-flow-ui.exe', 'dsh-sandbox.exe', 'dsh-flow/src/cli.ts')) {
              if ($names -notcontains $required) { throw "the package is missing $required" }
            }
          } finally {
            $archive.Dispose()
          }