    <rect x="3.4" y="12.5" width="4.2" height="8.1" rx="1.1"/>
    <rect x="9.9" y="7.4" width="4.2" height="13.2" rx="1.1"/>
    <rect x="16.4" y="3.4" width="4.2" height="17.2" rx="1.1"/>
  </g>
</svg>
